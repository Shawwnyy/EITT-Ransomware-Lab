<!DOCTYPE html>
<html lang="fr" data-theme="dark" data-session="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EITT Ransomware Lab — Ordinateur virtuel et simulation d'attaque</title>
  <meta name="description" content="EITT Ransomware Lab : un ordinateur virtuel (EITT OS) pour comprendre une attaque par ransomware, entièrement simulée dans le navigateur. Aucun vrai fichier n'est touché, rien n'est envoyé sur Internet.">
  <meta name="theme-color" content="#050a14">
  <link rel="icon" type="image/png" href="assets/logo/eitt-mark-64.png">
  <link rel="stylesheet" href="css/style.css">

  <link rel="stylesheet" href="css/applications.css">

</head>
<body>
  <div id="app">
    <!-- Bureau (caché tant qu'on n'est pas connecté) -->
    <div id="desktop" class="is-off" aria-hidden="true" inert>
      <div class="wallpaper-layer"></div>
      <div id="icon-layer" class="icon-layer" role="group" aria-label="Icônes du bureau"></div>
      <div id="windows-layer" class="windows-layer"></div>
      <div id="start-menu" class="start-menu" role="dialog" aria-label="Menu Démarrer" hidden></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>
      <div id="sim-banner" class="sim-banner" hidden role="status"></div>
      <footer id="taskbar" class="taskbar" aria-label="Barre des tâches"></footer>
    </div>
    <!-- Écrans de session : démarrage, connexion, verrouillage, veille, arrêt -->
    <div id="screen-root"></div>
    <!-- Menus contextuels et boîtes de dialogue simulés -->
    <div id="overlay-root"></div>
  </div>

  <noscript>
    <div class="noscript">
      <h1>EITT Ransomware Lab</h1>
      <p>Cette simulation d'ordinateur fonctionne avec JavaScript. Activez JavaScript dans votre navigateur puis rechargez la page.</p>
    </div>
  </noscript>
